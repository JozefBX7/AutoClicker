name: Build release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test
        run: dotnet test AutoClicker.Tests\AutoClicker.Tests.csproj
      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes
      - name: Package installer and portable build
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          .\scripts\Build-Release.ps1 -Version $version
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME .\dist\AutoClicker-Setup-x64.exe .\dist\AutoClicker-Portable-x64.zip --generate-notes --title "AutoClicker $env:GITHUB_REF_NAME"
